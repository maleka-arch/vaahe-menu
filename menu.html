*{box-sizing:border-box;margin:0;padding:0}

html{

}

    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND SLIDER
========================= */

.background-slider{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:#111;
}

.bg-slide{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1.5s ease;
}

.bg-slide.active{
    opacity:1;
}

.background-overlay{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        linear-gradient(
            rgba(0,0,0,.62),
            rgba(0,0,0,.78)
        );
}

/* =========================
   MAIN GLASS PAGE
========================= */

.page{
    width:100%;
    max-width:950px;
    min-height:100vh;
    margin:auto;
    padding:92px 18px 60px;

    /* شیشه‌ای واقعی و نیمه شفاف */
    background:rgba(255,255,255,.055);
    border-left:1px solid rgba(255,255,255,.08);
    border-right:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
}

/* =========================
   TOP BUTTONS
========================= */

.top-button{
    position:fixed;
    top:20px;
    width:56px;
    height:56px;
    border-radius:19px;

    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.13);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    cursor:pointer;
    z-index:1000;

    box-shadow:0 8px 30px rgba(0,0,0,.28);
}

.back-button{
    left:18px;
}

.menu-button{
    right:18px;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.95);
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
}

.restaurant-title{
    margin-top:15px;
    font-size:28px;
    font-weight:800;
}

.restaurant-english{
    margin-top:5px;
    font-size:14px;
    color:rgba(255,255,255,.85);
    direction:ltr;
    letter-spacing:2px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    height:60px;
    margin:28px 0 25px;

    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;

    border-radius:21px;
    border:1px solid rgba(255,255,255,.22);

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.search-icon{
    font-size:26px;
    opacity:.9;
}

#searchInput{
    flex:1;
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    text-align:right;
}

#searchInput::placeholder{
    color:rgba(255,255,255,.75);
}

/* =========================
   CATEGORY GRID
========================= */

#categories{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px;
    padding-bottom:30px;
}

/* =========================
   CATEGORY CARD
========================= */

.category-card{
    position:relative;
    height:320px;
    overflow:hidden;
    border-radius:27px;
    cursor:pointer;

    border:1px solid rgba(255,255,255,.30);

    background:rgba(255,255,255,.07);

    box-shadow:
        0 14px 40px rgba(0,0,0,.38);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.category-card:active{
    transform:scale(.98);
}

.category-card:hover{
    transform:translateY(-3px);
    box-shadow:
        0 18px 50px rgba(0,0,0,.48);
}

/* =========================
   CATEGORY IMAGE
========================= */

.card-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.03) 15%,
            rgba(0,0,0,.20) 42%,
            rgba(0,0,0,.88) 100%
        );
}

/* =========================
   GLASS CARD TEXT
========================= */

.card-content{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    min-height:116px;
    padding:17px 10px 18px;

    text-align:center;

    background:rgba(30,40,35,.48);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border-top:1px solid rgba(255,255,255,.20);
}

.title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.title-row::before,
.title-row::after{
    content:"";
    height:1px;
    background:rgba(255,255,255,.85);
    flex:1;
}

.card-title{
    font-size:18px;
    font-weight:800;
    white-space:nowrap;
}

.card-english{
    margin-top:6px;
    font-size:11px;
    direction:ltr;
    color:rgba(255,255,255,.92);
    letter-spacing:1px;
}

.card-line{
    width:45px;
    height:2px;
    margin:10px auto 0;
    border-radius:10px;
    background:rgba(255,255,255,.85);
}

/* =========================
   ITEMS PAGE
========================= */

#itemsPage{
    display:none;
}

#itemsPage.active{
    display:block;
}

.back-to-categories{
    width:100%;
    height:52px;
    margin-bottom:18px;

    border-radius:18px;
    border:1px solid rgba(255,255,255,.22);

    background:rgba(255,255,255,.12);
    color:#fff;

    font-family:inherit;
    font-size:14px;
    cursor:pointer;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

.items-header{

    height:240px;
    overflow:hidden;

    border-radius:28px;
    margin-bottom:20px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 12px 40px rgba(0,0,0,.35);

.items-header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.items-header-overlay{

    inset:0;
    background:

            rgba(0,0,0,.05),

.items-header-content{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    background:rgba(25,35,30,.42);

.items-header-content h2{
    font-size:25px;
    font-weight:800;
}

.items-header-content p{
    margin-top:4px;
    font-size:12px;
    direction:ltr;
    opacity:.85;
}

/* =========================
   MENU ITEMS
========================= */

.items-list{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:13px;

    min-height:90px;
    padding:11px 13px;

    border-radius:20px;
    border:1px solid rgba(255,255,255,.20);

    background:rgba(255,255,255,.105);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.item-image{
    width:70px;
    height:70px;
    flex-shrink:0;

    object-fit:cover;
    border-radius:16px;

    border:1px solid rgba(255,255,255,.18);
}

.item-info{
    flex:1;
    min-width:0;
}

.item-name{
    font-size:15px;
    font-weight:800;
}

.item-english{
    margin-top:2px;
    font-size:10px;
    direction:ltr;
    opacity:.68;
}

.item-description{
    margin-top:5px;
    font-size:10px;
    line-height:1.7;
    color:rgba(255,255,255,.72);
}

.item-price{
    white-space:nowrap;
    font-size:13px;
    font-weight:800;

/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    right:0;

    width:min(350px,88%);
    height:100vh;

    z-index:2000;

    padding:90px 25px 30px;

    background:rgba(22,30,26,.78);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    transform:translateX(100%);

.side-menu.active{
    transform:translateX(0);

.close-menu{
    position:absolute;
    top:20px;
    left:20px;

    width:48px;
    height:48px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.20);

.side-menu-item{

/* =========================================
   نمایش دسته‌بندی‌ها
========================================= */

function showCategories(list = categories){

    const categoriesBox =
        document.getElementById("categories");

    const itemsPage =
        document.getElementById("itemsPage");

    categoriesBox.style.display = "grid";

    itemsPage.classList.remove("active");

    categoriesBox.innerHTML = "";

    list.forEach(function(category){

        const card =
            document.createElement("div");

        card.className = "category-card";

        card.innerHTML = `

            <img
                src="${category.image}"
                class="card-image"
                alt="${category.name}"
            >

            <div class="card-overlay"></div>

            <div class="card-content">

                <div class="title-row">

                    <div class="card-title">
                        ${category.name}
                    </div>

                </div>

                <div class="card-english">
                    ${category.english}
                </div>

                <div class="card-line"></div>

            </div>

        `;

        card.addEventListener(
            "click",
            function(){
                openCategory(category.id);
            }
        );

        categoriesBox.appendChild(card);

    });
}


/* =========================================
   باز کردن یک دسته
========================================= */

function openCategory(categoryId){

    const category =
        categories.find(
            function(item){
                return item.id === categoryId;
            }
        );

    if(!category){
        return;
    }

    const categoriesBox =
        document.getElementById("categories");

    const itemsPage =
        document.getElementById("itemsPage");

    const itemsContent =
        document.getElementById("itemsContent");

    categoriesBox.style.display = "none";

    itemsPage.classList.add("active");

    const products =
        menuItems.filter(
            function(item){
                return item.category === categoryId;
            }
        );

    let html = `

        <div class="items-header">

            <img
                src="${category.image}"
                alt="${category.name}"
            >

            <div class="items-header-overlay"></div>

            <div class="items-header-content">

                <h2>
                    ${category.name}
                </h2>

                <p>
                    ${category.english}
                </p>

            </div>

        </div>

        <div class="items-list">

    `;

    if(products.length === 0){

        html += `

            <div class="menu-item">

                <div class="item-info">

                    <div class="item-name">
                        به‌زودی
                    </div>

                    <div class="item-description">
                        آیتم‌های این بخش در حال تکمیل هستند.
                    </div>

                </div>

            </div>

        `;

    }else{

        products.forEach(function(item){

            html += `

                <div class="menu-item">

                    <img
                        class="item-image"
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="item-info">

                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-english">
                            ${item.english}
                        </div>

                        <div class="item-description">
                            ${item.description}
                        </div>

                    </div>

                    <div class="item-price">
                        ${item.price}
                    </div>

                </div>

            `;

        });

    }

    html += `</div>`;

    itemsContent.innerHTML = html;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================
   جستجو
========================================= */

function searchItems(){

    const value =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    if(value === ""){

        showCategories();

        return;
    }

    const result =
        categories.filter(function(category){

            const categoryMatch =
                category.name
                    .toLowerCase()
                    .includes(value)
                ||
                category.english
                    .toLowerCase()
                    .includes(value);

            const itemMatch =
                menuItems.some(function(item){

                    return item.category === category.id
                        &&
                        (
                            item.name
                                .toLowerCase()
                                .includes(value)
                            ||
                            item.english
                                .toLowerCase()
                                .includes(value)
                        );

                });

            return categoryMatch || itemMatch;

        });

    showCategories(result);
}

/* =========================================
   دکمه بازگشت
========================================= */

function goBack(){

    const itemsPage =
        document.getElementById("itemsPage");

    if(itemsPage.classList.contains("active")){

        showCategories();

        return;

    }

    if(window.history.length > 1){

        window.history.back();

    }else{

        window.location.href = "index.html";

    }

}
