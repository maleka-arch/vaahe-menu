<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منوی واحه | Vaahe Hotel Restaurant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
    background:#111;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND SLIDER
========================= */

.background-slider{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:#111;
}

.bg-slide{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1.5s ease;
}

.bg-slide.active{
    opacity:1;
}

.background-overlay{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        linear-gradient(
            rgba(0,0,0,.62),
            rgba(0,0,0,.78)
        );
}

/* =========================
   MAIN GLASS PAGE
========================= */

.page{
    width:100%;
    max-width:950px;
    min-height:100vh;
    margin:auto;
    padding:92px 18px 60px;

    /* شیشه‌ای واقعی و نیمه شفاف */
    background:rgba(255,255,255,.055);
    border-left:1px solid rgba(255,255,255,.08);
    border-right:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
}

/* =========================
   TOP BUTTONS
========================= */

.top-button{
    position:fixed;
    top:20px;
    width:56px;
    height:56px;
    border-radius:19px;

    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.13);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    cursor:pointer;
    z-index:1000;

    box-shadow:0 8px 30px rgba(0,0,0,.28);
}

.back-button{
    left:18px;
}

.menu-button{
    right:18px;
}

/* =========================
   VAAHE / LILO STYLE HEADER
========================= */
.logo-wrap{
    position:relative;
    width:116px;
    height:116px;
    margin:0 auto;
}

.logo{
    width:116px;
    height:116px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.97);
    background:#fff;
    box-shadow:
        0 0 0 2px rgba(255,255,255,.16),
        0 10px 35px rgba(0,0,0,.45);
}

.verified-badge{
    position:absolute;
    right:-2px;
    bottom:1px;
    width:31px;
    height:31px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#159fe8;
    color:#fff;
    border:3px solid #fff;
    font-family:Arial,sans-serif;
    font-size:17px;
    font-weight:900;
    line-height:1;
    box-shadow:0 5px 15px rgba(0,0,0,.35);
}

.header{
    text-align:center;
    margin-bottom:24px;
    padding:24px 18px 21px;
    border-radius:30px;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.17);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 14px 45px rgba(0,0,0,.20);
}

.restaurant-title{
    margin-top:13px;
    font-size:25px;
    font-weight:800;
    line-height:1.6;
}

.restaurant-title:after{
    content:"";
    display:block;
    width:74%;
    height:1px;
    margin:10px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);
}

.restaurant-english{
    margin-top:7px;
    font-size:11px;
    color:rgba(255,255,255,.84);
    direction:ltr;
    letter-spacing:2px;
}

.search-box{
    border-radius:22px;
    background:rgba(255,255,255,.105);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 10px 35px rgba(0,0,0,.18);
}

.category-card{
    height:285px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,.34);
    box-shadow:0 12px 38px rgba(0,0,0,.40);
}

.card-content{
    min-height:104px;
    padding:15px 10px 17px;
    background:rgba(28,37,33,.48);
    backdrop-filter:blur(17px);
    -webkit-backdrop-filter:blur(17px);
    border-top:1px solid rgba(255,255,255,.16);
}

.title-row{gap:9px}
.title-row::before,.title-row::after{
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.52));
}
.title-row::after{
    background:linear-gradient(90deg,rgba(255,255,255,.52),transparent);
}
.card-title{font-size:16px}
.card-english{font-size:10px;opacity:.78}
.card-line{
    width:34px;
    height:2px;
    margin-top:9px;
    background:rgba(255,255,255,.60);
}

@media(max-width:600px){
    .header{padding:20px 14px 18px;border-radius:27px}
    .logo-wrap,.logo{width:104px;height:104px}
    .verified-badge{width:29px;height:29px;right:-3px;bottom:0;font-size:16px}
    .restaurant-title{font-size:23px}
    .restaurant-title:after{width:78%}
    .category-card{height:250px;border-radius:21px}
    .card-content{min-height:92px;padding:13px 7px 14px}
    .card-title{font-size:15px}
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.95);
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
}

.restaurant-title{
    margin-top:15px;
    font-size:28px;
    font-weight:800;
}

.restaurant-english{
    margin-top:5px;
    font-size:14px;
    color:rgba(255,255,255,.85);
    direction:ltr;
    letter-spacing:2px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    height:60px;
    margin:28px 0 25px;

    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;

    border-radius:21px;
    border:1px solid rgba(255,255,255,.22);

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.search-icon{
    font-size:26px;
    opacity:.9;
}

#searchInput{
    flex:1;
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    text-align:right;
}

#searchInput::placeholder{
    color:rgba(255,255,255,.75);
}

/* =========================
   CATEGORY GRID
========================= */

#categories{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px;
    padding-bottom:30px;
}

/* =========================
   CATEGORY CARD
========================= */

.category-card{
    position:relative;
    height:320px;
    overflow:hidden;
    border-radius:27px;
    cursor:pointer;

    border:1px solid rgba(255,255,255,.30);

    background:rgba(255,255,255,.07);

    box-shadow:
        0 14px 40px rgba(0,0,0,.38);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.category-card:active{
    transform:scale(.98);
}

.category-card:hover{
    transform:translateY(-3px);
    box-shadow:
        0 18px 50px rgba(0,0,0,.48);
}

/* =========================
   CATEGORY IMAGE
========================= */

.card-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.03) 15%,
            rgba(0,0,0,.20) 42%,
            rgba(0,0,0,.88) 100%
        );
}

/* =========================
   GLASS CARD TEXT
========================= */

.card-content{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    min-height:116px;
    padding:17px 10px 18px;

    text-align:center;

    background:rgba(30,40,35,.48);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border-top:1px solid rgba(255,255,255,.20);
}

.title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
}

/* خط‌های ظریف و محو دو طرف عنوان، شبیه لیلو */
.title-row::before,
.title-row::after{
    content:"";
    width:52px;
    max-width:52px;
    height:1px;
    flex:0 0 52px;
    border-radius:999px;
    opacity:.72;
}

.title-row::before{
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 18%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.08) 82%, transparent 100%);
}

.title-row::after{
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 18%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.08) 82%, transparent 100%);
}

.card-title{
    font-size:18px;
    font-weight:800;
    white-space:nowrap;
}

.card-english{
    margin-top:6px;
    font-size:11px;
    direction:ltr;
    color:rgba(255,255,255,.92);
    letter-spacing:1px;
}

.card-line{
    width:58px;
    height:1px;
    margin:10px auto 0;
    border-radius:999px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.48), transparent);
}

/* =========================
   ITEMS PAGE
========================= */

#itemsPage{
    display:none;
}

#itemsPage.active{
    display:block;
}

.back-to-categories{
    width:100%;
    height:52px;
    margin-bottom:18px;

    border-radius:18px;
    border:1px solid rgba(255,255,255,.22);

    background:rgba(255,255,255,.12);
    color:#fff;

    font-family:inherit;
    font-size:14px;
    cursor:pointer;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.items-header{
    position:relative;
    height:240px;
    overflow:hidden;

    border-radius:28px;
    margin-bottom:20px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 12px 40px rgba(0,0,0,.35);
}

.items-header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.items-header-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.86)
        );
}

.items-header-content{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    padding:22px;

    text-align:center;

    background:rgba(25,35,30,.42);

    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);

    border-top:1px solid rgba(255,255,255,.16);
}

.items-header-content h2{
    font-size:25px;
    font-weight:800;
}

.items-header-content p{
    margin-top:4px;
    font-size:12px;
    direction:ltr;
    opacity:.85;
}

/* =========================
   MENU ITEMS
========================= */

.items-list{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:13px;

    min-height:90px;
    padding:11px 13px;

    border-radius:20px;
    border:1px solid rgba(255,255,255,.20);

    background:rgba(255,255,255,.105);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.item-image{
    width:70px;
    height:70px;
    flex-shrink:0;

    object-fit:cover;
    border-radius:16px;

    border:1px solid rgba(255,255,255,.18);
}

.item-info{
    flex:1;
    min-width:0;
}

.item-name{
    font-size:15px;
    font-weight:800;
}

.item-english{
    margin-top:2px;
    font-size:10px;
    direction:ltr;
    opacity:.68;
}

.item-description{
    margin-top:5px;
    font-size:10px;
    line-height:1.7;
    color:rgba(255,255,255,.72);
}

.item-price{
    white-space:nowrap;
    font-size:13px;
    font-weight:800;
}

/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    right:0;

    width:min(350px,88%);
    height:100vh;

    z-index:2000;

    padding:90px 25px 30px;

    background:rgba(22,30,26,.78);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    border-left:1px solid rgba(255,255,255,.18);

    transform:translateX(100%);
    transition:transform .35s ease;
}

.side-menu.active{
    transform:translateX(0);
}

.close-menu{
    position:absolute;
    top:20px;
    left:20px;

    width:48px;
    height:48px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.20);
    background:rgba(255,255,255,.10);

    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.side-menu h2{
    font-size:27px;
    margin-bottom:20px;
}

.side-menu-item{
    padding:18px 5px;

    border-bottom:1px solid rgba(255,255,255,.12);

    font-size:16px;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:88px 14px 50px;
    }

    .logo{

    }

    .restaurant-title{
        font-size:24px;
    }

    .restaurant-english{
        font-size:11px;

    #categories{
        gap:18px;
    }

    .category-card{
        height:315px;
        border-radius:23px;
    }

    .card-content{
        min-height:112px;
        padding:15px 8px;
    }

    .card-title{
        font-size:16px;
    }

    .card-english{
        font-size:10px;
    }

    .top-button{
        width:52px;
        height:52px;
        top:18px;
    }

    .back-button{
        left:13px;
    }

    .menu-button{
        right:13px;
    }

    .items-header{
        height:220px;
    }

    .items-header-content h2{
        font-size:23px;
    }

    .item-image{
        width:65px;
        height:65px;
    }

    .item-name{
        font-size:14px;
    }
}

@media(max-width:370px){

    #categories{
        gap:12px;
    }

    .category-card{
        height:285px;
    }

    .card-title{
        font-size:14px;
    }
}
</style>
</head>

<script>

/* =========================================
   BACKGROUND SLIDER
========================================= */

const bgSlides =
    document.querySelectorAll(".bg-slide");

let currentBg = 0;

setInterval(function(){

    bgSlides[currentBg].classList.remove("active");

    currentBg =
        (currentBg + 1) % bgSlides.length;

    bgSlides[currentBg].classList.add("active");

},7000);

/* بارگذاری اولیه عکس‌های منو برای جلوگیری از دیر ظاهر شدن */
["20687.jpg","20688.jpg","20690.jpg","20691.jpg","20692.jpg","20693.jpg","20694.jpg","20695.jpg","20903.jpg"].forEach(function(src){
    const img = new Image();
    img.src = src;
});


/* =========================================
   دسته‌بندی‌ها
========================================= */

    {id:"appetizer", name:"پیش غذا", english:"Appetizer", image:"20693.jpg"},

    {id:"pasta", name:"پاستا", english:"Pasta", image:"20690.jpg"},
    {id:"steak", name:"استیک", english:"Steak", image:"20693.jpg"},
    {id:"vegetarian", name:"وجترین", english:"Vegetarian", image:"20692.jpg"},
    {id:"vegan", name:"وگان", english:"Vegan", image:"20692.jpg"},
    {id:"coldcoffee", name:"نوشیدنی سرد بر پایه قهوه", english:"Iced Coffee", image:"20695.jpg"},
    {id:"colddrinks", name:"نوشیدنی‌های سرد", english:"Cold Drinks", image:"20694.jpg"},
    {id:"hot", name:"نوشیدنی‌های گرم", english:"Hot Coffee", image:"20695.jpg"},
    {id:"tea", name:"چای و دمنوش", english:"Tea & Herbal", image:"20903.jpg"}

/* =========================================
   آیتم‌های منو
========================================= */

const menuItems = [
    {category:"appetizer",name:"استیک لقمه‌ای",english:"Steak Bites",description:"تکه‌های گوشت گریل‌شده با دورچین مخصوص",price:"—",image:"20693.jpg"},
    {category:"appetizer",name:"پیش‌غذای واحه",english:"Vaahe Appetizer",description:"ترکیبی از پیش‌غذاهای تازه و مخصوص",price:"—",image:"20692.jpg"},

    {category:"breakfast",name:"صبحانه واحه",english:"Vaahe Breakfast",description:"صبحانه کامل با نان تازه و مخلفات",price:"—",image:"20691.jpg"},
    {category:"breakfast",name:"صبحانه انگلیسی",english:"English Breakfast",description:"تخم‌مرغ، سوسیس، نان و مخلفات صبحانه",price:"—",image:"20691.jpg"},

    {category:"bakery",name:"نان تازه",english:"Fresh Bread",description:"نان تازه روزانه",price:"—",image:"20691.jpg"},

/* =========================================
   نمایش دسته‌بندی‌ها
========================================= */

function showCategories(list = categories){

    const categoriesBox =
        document.getElementById("categories");

    const itemsPage =
        document.getElementById("itemsPage");

    categoriesBox.style.display = "grid";

    itemsPage.classList.remove("active");

    categoriesBox.innerHTML = "";

    list.forEach(function(category){

        const card =
            document.createElement("div");

        card.className = "category-card";

        card.innerHTML = `

            <img
                src="${category.image}"
                class="card-image"
                alt="${category.name}"
            >

            <div class="card-overlay"></div>

            <div class="card-content">

                <div class="title-row">

                    <div class="card-title">
                        ${category.name}
                    </div>

                </div>

                <div class="card-english">
                    ${category.english}
                </div>

                <div class="card-line"></div>

            </div>

        `;

        card.addEventListener(
            "click",
            function(){
                openCategory(category.id);
            }
        );

        categoriesBox.appendChild(card);

    });
}


/* =========================================
   باز کردن یک دسته
========================================= */

function openCategory(categoryId){

    const category =
        categories.find(
            function(item){
                return item.id === categoryId;
            }
        );

    if(!category){
        return;
    }

    const categoriesBox =
        document.getElementById("categories");

    const itemsPage =
        document.getElementById("itemsPage");

    const itemsContent =
        document.getElementById("itemsContent");

    categoriesBox.style.display = "none";

    itemsPage.classList.add("active");

    const products =
        menuItems.filter(
            function(item){
                return item.category === categoryId;
            }
        );

    let html = `

        <div class="items-header">

            <img
                src="${category.image}"
                alt="${category.name}"
            >

            <div class="items-header-overlay"></div>

            <div class="items-header-content">

                <h2>
                    ${category.name}
                </h2>

                <p>
                    ${category.english}
                </p>

            </div>

        </div>

        <div class="items-list">

    `;

    if(products.length === 0){

        html += `

            <div class="menu-item">

                <div class="item-info">

                    <div class="item-name">
                        به‌زودی
                    </div>

                    <div class="item-description">
                        آیتم‌های این بخش در حال تکمیل هستند.
                    </div>

                </div>

            </div>

        `;

    }else{

        products.forEach(function(item){

            html += `

                <div class="menu-item">

                    <img
                        class="item-image"
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="item-info">

                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-english">
                            ${item.english}
                        </div>

                        <div class="item-description">
                            ${item.description}
                        </div>

                    </div>

                    <div class="item-price">
                        ${item.price}
                    </div>

                </div>

            `;

        });

    }

    html += `</div>`;

    itemsContent.innerHTML = html;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================
   جستجو
========================================= */

function searchItems(){

    const value =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    if(value === ""){

        showCategories();

        return;
    }

    const result =
        categories.filter(function(category){

            const categoryMatch =
                category.name
                    .toLowerCase()
                    .includes(value)
                ||
                category.english
                    .toLowerCase()
                    .includes(value);

            const itemMatch =
                menuItems.some(function(item){

                    return item.category === category.id
                        &&
                        (
                            item.name
                                .toLowerCase()
                                .includes(value)
                            ||
                            item.english
                                .toLowerCase()
                                .includes(value)
                        );

                });

            return categoryMatch || itemMatch;

        });

    showCategories(result);
}

    const itemsPage =
        document.getElementById("itemsPage");

    if(itemsPage.classList.contains("active")){

        showCategories();

        return;

    }

    window.location.href = "index.html";

}
