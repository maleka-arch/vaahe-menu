<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هتل رستوران واحه</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #17251d;
}

/* پس زمینه */
.background-image {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url("bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(6px) brightness(0.62);
    transform: scale(1.08);
    z-index: 1;
}

/* لایه روی عکس */
.overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 25, 19, 0.42);
    z-index: 2;
}

/* کارت اصلی */
.main-card {
    position: relative;
    z-index: 3;
    width: 90%;
    max-width: 390px;
    min-height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 34px 20px 18px;
}

/* لوگو — کوچک‌تر مثل لیلو */
.logo-wrapper {
    width: 96px;
    height: 96px;
    flex: 0 0 96px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 13px;
    background: #fff;
    border: 3px solid rgba(255,255,255,0.92);
    box-shadow: 0 5px 22px rgba(0,0,0,0.42);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* عکس لوگو */
.restaurant-logo {
    width: 135%;
    height: 135%;
    object-fit: cover;
    display: block;
    border-radius: 0;
    border: none;
    transform: scale(1.08);
}

/* عنوان فارسی */
.brand-title-fa {
    width: 100%;
    color: white;
    font-size: 1.32rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

/* عنوان انگلیسی */
.brand-title-en {
    width: 100%;
    color: #eee8dd;
    font-size: 0.82rem;
    font-weight: 400;
    direction: ltr;
    text-align: center;
    margin-bottom: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    letter-spacing: 0.3px;
}

/* خط‌های محو دو طرف */
.green-divider {
    width: 78%;
    height: 1px;
    margin: 15px auto 13px;
    background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255,255,255,0.08) 8%,
        rgba(255,255,255,0.55) 24%,
        rgba(255,255,255,0.62) 50%,
        rgba(255,255,255,0.55) 76%,
        rgba(255,255,255,0.08) 92%,
        transparent 100%
    );
}

/* متن */
.info-box {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: #f8f3eb;
    font-size: 0.82rem;
    line-height: 1.85;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.info-box p {
    width: 100%;
    margin: 0;
}

/* خط محو بین خوش‌آمدگویی و رزرو */
.info-divider {
    width: 72%;
    height: 1px;
    margin: 12px auto;
    background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255,255,255,0.06) 8%,
        rgba(255,255,255,0.40) 30%,
        rgba(255,255,255,0.48) 50%,
        rgba(255,255,255,0.40) 70%,
        rgba(255,255,255,0.06) 92%,
        transparent 100%
    );
}

/* دکمه پایین صفحه، مثل لیلو */
.continue-btn {
    width: 100%;
    margin-top: auto;
    margin-bottom: 4px;
    padding: 13px;
    min-height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    background: rgba(45,64,52,0.78);
    border: 1px solid rgba(255,255,255,0.48);
    border-radius: 12px;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
}

/* موبایل */
@media (max-width: 480px) {
    .main-card {
        width: 90%;
        padding: 30px 18px 17px;
    }

    .logo-wrapper {
        width: 92px;
        height: 92px;
        flex-basis: 92px;
    }

    .brand-title-fa {
        font-size: 1.28rem;
    }

    .brand-title-en {
        font-size: 0.78rem;
    }

    .green-divider {
        width: 80%;
        margin-top: 14px;
        margin-bottom: 12px;
    }

    .info-box {
        font-size: 0.80rem;
    }

    .info-divider {
        width: 75%;
        margin: 11px auto;
    }

    .continue-btn {
        font-size: 0.92rem;
        min-height: 49px;
    }
}

/* صفحه‌های خیلی کوتاه */
@media (max-height: 680px) {
    .main-card {
        padding-top: 20px;
        padding-bottom: 12px;
    }

    .logo-wrapper {
        width: 82px;
        height: 82px;
        flex-basis: 82px;
        margin-bottom: 9px;
    }

    .brand-title-fa {
        font-size: 1.18rem;
    }

    .brand-title-en {
        font-size: 0.74rem;
    }

    .green-divider {
        margin: 10px auto;
    }

    .info-box {
        font-size: 0.75rem;
        line-height: 1.7;
    }

    .info-divider {
        margin: 8px auto;
    }

    .continue-btn {
        min-height: 46px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="background-image"></div>
<div class="overlay"></div>

<div class="main-card">

    <div class="logo-wrapper">
        <img
            src="logo.png"
            alt="لوگو هتل رستوران واحه"
            class="restaurant-logo"
        >
    </div>

    <h1 class="brand-title-fa">
        هتل رستوران واحه
    </h1>

    <h2 class="brand-title-en">
        vaahe hotel restaurant
    </h2>

    <div class="green-divider"></div>

    <div class="info-box">

        <p>
            مهمانان گرامی به هتل رستوران واحه
        </p>

        <p>
            خوش آمدید
        </p>

        <div class="info-divider"></div>

        <p>
            جهت رزرو اتاق‌های هتل با شماره داخل منو تماس بگیرید
        </p>

    </div>

    <!-- منوی جدید -->
    <a href="main.html" class="continue-btn">
        ورود به منو
    </a>

</div>

</body>
</html>
