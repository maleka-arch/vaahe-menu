<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هتل رستوران واحه</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', sans-serif;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    position: relative;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #17251d;
}


/* پس زمینه جدید */

.background-image {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background-image: url("bg.jpg");

    background-size: cover;
    background-position: center;

    background-repeat: no-repeat;

    filter: blur(6px) brightness(0.62);

    transform: scale(1.08);

    z-index: 1;
}


/* لایه روی عکس */

.overlay {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(15, 25, 19, 0.42);

    z-index: 2;
}


/* کل محتوای صفحه */

.main-card {

    position: relative;

    z-index: 3;

    width: 90%;
    max-width: 390px;

    min-height: 100vh;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px 20px;
}


/* لوگو */

.logo-wrapper {

    width: 180px;
    height: 180px;

    border-radius: 50%;

    overflow: hidden;

    margin-bottom: 18px;

    background: transparent;

    border: none;

    box-shadow: 0 5px 25px rgba(0,0,0,0.45);

    display: flex;

    justify-content: center;

    align-items: center;
}


/* عکس لوگو */

.restaurant-logo {

    width: 135%;
    height: 135%;

    object-fit: cover;

    display: block;

    border-radius: 0;

    border: none;

    transform: scale(1.08);
}


/* عنوان فارسی */

.brand-title-fa {

    width: 100%;

    color: white;

    font-size: 1.55rem;

    font-weight: 700;

    text-align: center;

    margin-bottom: 3px;

    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}


/* عنوان انگلیسی */

.brand-title-en {

    width: 100%;

    color: #eee8dd;

    font-size: 0.9rem;

    font-weight: 400;

    direction: ltr;

    text-align: center;

    margin-bottom: 0;

    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}


/* خط */

.green-divider {

    width: 75%;

    height: 1px;

    margin: 18px auto;

    background: rgba(255,255,255,0.65);
}


/* متن */

.info-box {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    color: #f8f3eb;

    font-size: 0.9rem;

    line-height: 1.9;

    text-align: center;

    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}


/* دکمه */

.continue-btn {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: white;

    background: rgba(45,64,52,0.78);

    border: 1px solid rgba(255,255,255,0.5);

    border-radius: 12px;

    text-decoration: none;

    font-size: 1rem;

    font-weight: 600;

    text-align: center;

    backdrop-filter: blur(8px);

}


/* موبایل */

@media (max-width: 480px) {

    .logo-wrapper {
        width: 160px;
        height: 160px;
    }

    .restaurant-logo {
        width: 135%;
        height: 135%;
    }

    .brand-title-fa {
        font-size: 1.4rem;
    }

    .brand-title-en {
        font-size: 0.85rem;
    }

}

</style>
</head>


<body>

<div class="background-image"></div>

<div class="overlay"></div>


<div class="main-card">


    <div class="logo-wrapper">

        <img
            src="logo.png"
            alt="لوگو هتل رستوران واحه"
            class="restaurant-logo"
        >

    </div>


    <h1 class="brand-title-fa">
        هتل رستوران واحه
    </h1>


    <h2 class="brand-title-en">
        vaahe hotel restaurant
    </h2>


    <div class="green-divider"></div>


    <div class="info-box">
    <p>
            مهمانان گرامی به هتل رستوران واحه
        </p>

        <p>
            خوش آمدید
        </p>

        <p>
            جهت رزرو اتاق‌های هتل با شماره داخل منو تماس بگیرید
        </p>

    </div>


    <a href="main.html" class="continue-btn">
        ورود به منو
    </a>


</div>

</body>

</html>
